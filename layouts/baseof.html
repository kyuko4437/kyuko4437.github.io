{{- /*
  全ページ共通の骨組み。
  個別の中身は {{ block "main" }} の部分に差し込まれる。
*/ -}}
<!DOCTYPE html>
<html lang="ja">
{{ partial "head.html" . }}
<body>
<div class="site">
  {{ partial "sidebar.html" . }}
  <div class="main-col">
    {{/* 本文の上の帯。左にタブ、右にカウンター */}}
    <div class="topbar">
      {{ partial "tabs.html" . }}
      {{ partial "counter.html" . }}
    </div>
    <main class="content">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
</div>
{{ partial "footer.html" . }}
</body>
</html>
